apiVersion: application.zitadel.didactiklabs.io/v1alpha1
kind: Oidc
metadata:
  name: agentgateway
spec:
  forProvider:
    # THE TWO SETTINGS THAT MATTER, and why:
    #
    # accessTokenType: OIDC_TOKEN_TYPE_JWT — every other Oidc app in this repo
    #   and in argus uses OIDC_TOKEN_TYPE_BEARER, which issues an OPAQUE token.
    #   An opaque token carries no claims and cannot be validated against a
    #   JWKS; it only works via introspection. agentgateway's jwtAuthentication
    #   verifies signatures against
    #   https://rpcu-gabeck.eu1.zitadel.cloud/oauth/v2/keys, so it needs a real
    #   JWT. Change this and the LLM gateway rejects every request.
    #
    # accessTokenRoleAssertion: true — the argus-owned `groupsClaim` Zitadel
    #   Action flattens the user's project role grants into a `groups` claim,
    #   but only for tokens where role assertion is on. That claim is what
    #   policy-gateway.yaml keys the budget tier off (rpcu-admin /
    #   public-admin / public-user). Without it every caller silently falls
    #   through to the smallest tier.
    accessTokenRoleAssertion: true
    accessTokenType: OIDC_TOKEN_TYPE_JWT
    idTokenRoleAssertion: true
    idTokenUserinfoAssertion: true

    # Supports two flows:
    #   1. PKCE (authorization_code) — human users authenticate via browser,
    #      get a JWT, paste it into opencode /connect.
    #   2. Client credentials — machine callers exchange client_id + client_secret
    #      for a JWT at the token endpoint (no browser needed).
    # Both produce JWTs validated by agentgateway against the Zitadel JWKS.
    appType: OIDC_APP_TYPE_WEB
    authMethodType: OIDC_AUTH_METHOD_TYPE_BASIC
    grantTypes:
      - OIDC_GRANT_TYPE_AUTHORIZATION_CODE
      - OIDC_GRANT_TYPE_REFRESH_TOKEN
    responseTypes:
      - OIDC_RESPONSE_TYPE_CODE
    redirectUris:
      - http://localhost:8085/callback
    postLogoutRedirectUris:
      - "*"
    additionalOrigins: []
    clockSkew: 0s
    devMode: false
    name: agentgateway
    skipNativeAppSuccessPage: false
    version: OIDC_VERSION_1_0
    orgId: "369994019545117645"
    projectId: "370001231734928333" # administration
  # Confidential client: the connection secret carries both client_id and
  # client_secret. The secret is used for client_credentials (machine access)
  # and can also be used for PKCE token exchange. Backed up to Vault via
  # pushsecret-oidc.yaml so it survives cluster rebuilds.
  writeConnectionSecretToRef:
    name: agentgateway-oidc
    namespace: agentgateway-system
