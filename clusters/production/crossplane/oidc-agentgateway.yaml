# Zitadel OIDC client for the LLM stack's chat UI, consumed by Open WebUI.
#
# Open WebUI handles the OIDC browser login (redirect/cookie/session) itself —
# no oauth2-proxy, no native agentgateway OIDC. The flow:
#   browser -> chat.rpcu.io -> Open WebUI (no session) -> redirect to Zitadel
#   -> user authenticates -> Zitadel redirects to /oauth/oidc/callback
#   -> Open WebUI exchanges code -> session cookie set
#   -> Open WebUI proxies LLM calls to llm:80 (no auth downstream)
#
# appType is IMMUTABLE in Zitadel. The existing WEB + BASIC pairing is a
# confidential client with a client_secret, which is what Open WebUI's
# server-side authorization_code flow needs. Do not change it.
#
# accessTokenType: OIDC_TOKEN_TYPE_JWT is load-bearing: it makes the access token
# a verifiable JWT. ENABLE_OAUTH_ROLE_MANAGEMENT + OAUTH_ROLES_CLAIM=groups in
# Open WebUI read the `groups` claim from this token for role mapping.
# accessTokenRoleAssertion + idTokenRoleAssertion are also load-bearing: the
# argus-owned `groupsClaim` Zitadel Action flattens project role grants into a
# `groups` claim, but only for tokens with assertion enabled. Turn these off
# and every user lands on the default role regardless of their grants.
---
apiVersion: application.zitadel.didactiklabs.io/v1alpha1
kind: Oidc
metadata:
  name: agentgateway
spec:
  forProvider:
    accessTokenRoleAssertion: true
    accessTokenType: OIDC_TOKEN_TYPE_JWT
    idTokenRoleAssertion: true
    idTokenUserinfoAssertion: true

    appType: OIDC_APP_TYPE_WEB
    authMethodType: OIDC_AUTH_METHOD_TYPE_BASIC
    grantTypes:
      - OIDC_GRANT_TYPE_AUTHORIZATION_CODE
      - OIDC_GRANT_TYPE_REFRESH_TOKEN
    responseTypes:
      - OIDC_RESPONSE_TYPE_CODE

    # Open WebUI's OIDC callback path.
    redirectUris:
      - https://chat.rpcu.io/oauth/oidc/callback
    postLogoutRedirectUris:
      - "*"
    additionalOrigins: []
    clockSkew: 0s
    devMode: false
    name: agentgateway
    skipNativeAppSuccessPage: false
    version: OIDC_VERSION_1_0
    orgId: "369994019545117645"
    projectId: "370001231734928333" # administration
  # Connection secret lands in agentgateway-system where Open WebUI reads the
  # client_id / client_secret (attribute.client_id / attribute.client_secret).
  writeConnectionSecretToRef:
    name: agentgateway-oidc
    namespace: agentgateway-system
