# Zitadel OIDC client for the LLM stack's built-in chat UI.
#
# agentgateway's built-in UI (port 15000) handles its own OIDC browser login
# via `traffic.oidc` on the Gateway — no Open WebUI, no oauth2-proxy. The flow:
#   browser -> chat.rpcu.io -> agentgateway (no session) -> redirect to Zitadel
#   -> user authenticates -> Zitadel redirects to /oauth/callback
#   -> agentgateway exchanges code for JWT (PKCE) -> session cookie set
#
# appType is IMMUTABLE in Zitadel. The existing WEB + BASIC pairing is a
# confidential client with a client_secret, which is what agentgateway's
# server-side authorization_code flow needs. Do not change it.
#
# accessTokenRoleAssertion + idTokenRoleAssertion are load-bearing: the
# argus-owned `groupsClaim` Zitadel Action flattens project role grants into a
# `groups` claim, but only for tokens with assertion enabled. agentgateway uses
# that claim in rate limit descriptors (jwt.groups) for per-group tiering.
# Turn these off and every user falls through to the smallest tier.
---
apiVersion: application.zitadel.didactiklabs.io/v1alpha1
kind: Oidc
metadata:
  name: agentgateway
spec:
  forProvider:
    accessTokenRoleAssertion: true
    accessTokenType: OIDC_TOKEN_TYPE_JWT
    idTokenRoleAssertion: true
    idTokenUserinfoAssertion: true

    appType: OIDC_APP_TYPE_WEB
    authMethodType: OIDC_AUTH_METHOD_TYPE_BASIC
    grantTypes:
      - OIDC_GRANT_TYPE_AUTHORIZATION_CODE
      - OIDC_GRANT_TYPE_REFRESH_TOKEN
    responseTypes:
      - OIDC_RESPONSE_TYPE_CODE

    # agentgateway's OIDC policy redirectURI must match one of these exactly.
    redirectUris:
      - https://chat.rpcu.io/oauth/callback
    postLogoutRedirectUris:
      - "*"
    additionalOrigins: []
    clockSkew: 0s
    devMode: false
    name: agentgateway
    skipNativeAppSuccessPage: false
    version: OIDC_VERSION_1_0
    orgId: "369994019545117645"
    projectId: "370001231734928333" # administration
  # Connection secret lands in agentgateway-system where the OIDC policy reads
  # the client_id / client_secret directly.
  writeConnectionSecretToRef:
    name: agentgateway-oidc
    namespace: agentgateway-system
