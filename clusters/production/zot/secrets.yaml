# htpasswd file for zot CLI (docker/podman) basic-auth login. The chart mounts
# the Secret named "<release>-secret" at /secret when mountSecret is true, so this
# ExternalSecret MUST target the name "zot-secret" and expose an "htpasswd" key
# (bcrypt lines, e.g. `htpasswd -bBn admin <pw>`). Populate the Vault path
# secrets-production/zot/htpasswd (key "htpasswd") out of band.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-secret
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: zot-secret
  data:
    - secretKey: htpasswd
      remoteRef:
        key: secrets-production/zot/htpasswd
        property: htpasswd
---
# S3 credentials for the Ceph object store, consumed by zot as AWS_* env vars
# (the distribution S3 driver's default credential chain). These are the access
# key / secret key of the argus CephObjectStoreUser "rpcu" (rook-ceph ns on the
# openstack cluster), which has full bucket capability and can create/use the
# "zot" bucket. Copy them into Vault secrets-production/zot/s3
# (keys access-key / secret-key) out of band from the argus-side secret
# rook-ceph-object-user-rpcu-rpcu.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-s3
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: zot-s3
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: secrets-production/zot/s3
        property: access-key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: secrets-production/zot/s3
        property: secret-key
---
# OIDC credentials file for zot's web-UI social login. zot expects a JSON file
# with "clientid"/"clientsecret". The Crossplane Zitadel connection secret
# (zot-oidc, written into this namespace by oidc-zot.yaml) is pushed to Vault by
# pushsecret-oidc.yaml; we read it back here and template the credentials file so
# there is no manual copy step. Mounted at /secret-oidc/oidc-credentials.json via
# the chart's externalSecrets (see helmrelease.yaml), referenced by config.json's
# openid.providers.oidc.credentialsFile. (Kept on a separate mount path from the
# htpasswd /secret mount so the two do not collide.)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-oidc-credentials
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: zot-oidc-credentials
    template:
      engineVersion: v2
      data:
        oidc-credentials.json: |-
          {
            "clientid": "{{ .clientId }}",
            "clientsecret": "{{ .clientSecret }}"
          }
  data:
    - secretKey: clientId
      remoteRef:
        key: secrets-production/zot/oidc
        property: clientId
    - secretKey: clientSecret
      remoteRef:
        key: secrets-production/zot/oidc
        property: clientSecret
