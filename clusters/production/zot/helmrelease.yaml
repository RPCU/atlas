apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot
spec:
  interval: 1h
  chart:
    spec:
      chart: zot
      version: 0.1.122
      sourceRef:
        kind: HelmRepository
        name: project-zot
  values:
    image:
      repository: ghcr.io/project-zot/zot
      # Full-featured image (ui/search/metrics extensions used in config.json).
      tag: v2.1.19
    replicaCount: 1
    strategy:
      type: Recreate
    service:
      type: ClusterIP
      port: 5000
    # Inline the zot config via the chart's configFiles value. The chart creates
    # the <release>-config ConfigMap and mounts it at /etc/zot/config.json with
    # the correct "serve" subcommand args.
    mountConfig: true
    mountSecret: true
    # Mount the templated OIDC credentials file on a separate path.
    externalSecrets:
      - secretName: zot-oidc-credentials
        mountPath: /secret-oidc
    # No persistent volume: blobs live in Ceph S3 and the dedup cache is remote
    # (Redis/Dragonfly). rootDirectory (/var/lib/registry) is transient scratch
    # only, so back it with an emptyDir.
    persistence: false
    extraVolumes:
      - name: rpcu-ca
        configMap:
          name: rpcu-ca-trust
    extraVolumeMounts:
      - name: rpcu-ca
        mountPath: /etc/zot/certs
        readOnly: true
    # S3 credentials for the Ceph object store, via the default AWS credential
    # chain (distribution S3 driver).
    env:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: zot-s3
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: zot-s3
            key: AWS_SECRET_ACCESS_KEY
      - name: SSL_CERT_FILE
        value: /etc/zot/certs/ca.crt
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
    # zot config: S3 storage, Redis dedup cache, Zitadel OIDC + htpasswd auth,
    # UI/search/metrics extensions. The htpasswd file is mounted at /secret from
    # the zot-secret ExternalSecret. OIDC credentials from /secret-oidc.
    configFiles:
      config.json: |-
        {
          "distSpecVersion": "1.1.0",
          "storage": {
            "rootDirectory": "/var/lib/registry",
            "dedupe": true,
            "remoteCache": true,
            "gc": true,
            "gcDelay": "1h",
            "gcInterval": "24h",
            "storageDriver": {
              "name": "s3",
              "rootdirectory": "/zot",
              "region": "us-east-1",
              "regionendpoint": "https://s3.rpcu.vpn",
              "bucket": "zot",
              "secure": true,
              "skipverify": false,
              "forcepathstyle": true
            },
            "cacheDriver": {
              "name": "redis",
              "url": "redis://zot-dragonfly:6379",
              "keyprefix": "zot"
            }
          },
          "http": {
            "address": "0.0.0.0",
            "port": "5000",
            "externalUrl": "https://zot.rpcu.io",
            "auth": {
              "htpasswd": {
                "path": "/secret/htpasswd"
              },
              "openid": {
                "providers": {
                  "oidc": {
                    "name": "ZITADEL",
                    "issuer": "https://rpcu-gabeck.eu1.zitadel.cloud",
                    "credentialsFile": "/secret-oidc/oidc-credentials.json",
                    "keypath": "",
                    "scopes": ["openid", "profile", "email", "groups"]
                  }
                }
              }
            },
            "accessControl": {
              "repositories": {
                "**": {
                  "policies": [
                    {
                      "groups": ["admin"],
                      "actions": ["read", "create", "update", "delete"]
                    }
                  ],
                  "defaultPolicy": ["read", "create", "update"],
                  "anonymousPolicy": ["read"]
                }
              },
              "adminPolicy": {
                "users": ["admin"],
                "actions": ["read", "create", "update", "delete"]
              }
            }
          },
          "log": {
            "level": "info"
          },
          "extensions": {
            "ui": {
              "enable": true
            },
            "search": {
              "enable": true
            },
            "metrics": {
              "enable": true,
              "prometheus": {
                "path": "/metrics"
              }
            }
          }
        }
