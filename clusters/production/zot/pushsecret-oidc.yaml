# Back up the Crossplane-written zot-oidc connection secret (Zitadel client
# id/secret) to Vault, mirroring the other apps. zot-oidc-credentials
# (secrets.yaml) reads these back to build zot's credentials file.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: zot-oidc
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: vault-backend
      kind: ClusterSecretStore
  selector:
    secret:
      name: zot-oidc
  data:
    - match:
        secretKey: attribute.client_id
        remoteRef:
          remoteKey: secrets-production/zot/oidc
          property: clientId
    - match:
        secretKey: attribute.client_secret
        remoteRef:
          remoteKey: secrets-production/zot/oidc
          property: clientSecret
