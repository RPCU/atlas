# Open WebUI — the chat frontend, and the ONLY authenticated entry point to the
# LLM stack.
#
#   internet -> https-external (kgateway, TLS, chat.rpcu.io)
#            -> open-webui  (Zitadel OIDC login happens HERE)
#            -> llm:80      (agentgateway, no auth, ClusterIP)
#            -> api.anthropic.com  (credential injected at the gateway)
#
# Authentication used to live on the gateway as a Zitadel JWT check. It lives
# here now, which is why nothing downstream authenticates anything.
#
# ---- TWO CONFIG TRAPS SPECIFIC TO THIS APP --------------------------------
# 1. Most settings here are "ConfigVars": Open WebUI persists them to its SQLite
#    DB on first boot and IGNORES the environment on every boot after that. That
#    makes a GitOps-managed Deployment lie to you — you change the manifest,
#    Flux applies it, and nothing happens. ENABLE_PERSISTENT_CONFIG=false turns
#    that off so the env stays authoritative. The tradeoff is real: NO change
#    made in the Admin Panel survives a restart. Configure this app by editing
#    this file, not through its UI.
# 2. WEBUI_SECRET_KEY signs sessions AND encrypts stored OAuth tokens. The image
#    silently generates one into the container filesystem if it is unset, so
#    every pod restart would invalidate every session. It comes from Vault here
#    precisely so it is stable.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: agentgateway-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: agentgateway-system
spec:
  replicas: 1
  # SQLite on an RWO volume. A second replica would need Postgres + Redis + an
  # external vector DB, which is not worth it for this user count.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      initContainers:
        # The image bakes its embedding and whisper models into
        # /app/backend/data/cache at build time. Mounting the PVC there MASKS
        # them, and the app would silently re-download ~1GB from HuggingFace on
        # first boot. This seeds the empty volume from the image instead.
        # `-n` (no-clobber) makes it a no-op on every subsequent restart.
        - name: seed-data
          image: ghcr.io/open-webui/open-webui:v0.11.3
          command:
            - /bin/sh
            - -c
            - cp -R -n /app/backend/data/. /tmp/app-data/ || true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /tmp/app-data
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.11.3
          env:
            # ---- Identity / public URL --------------------------------------
            # WEBUI_URL is what Open WebUI uses to build OAuth redirect URIs.
            # Getting it wrong produces a login failure that surfaces in the
            # browser as "The email or password provided is incorrect", which
            # points nowhere near the real cause.
            - name: WEBUI_URL
              value: https://chat.rpcu.io
            - name: ENABLE_PERSISTENT_CONFIG
              value: "false"
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: secret-key

            # ---- Zitadel OIDC ----------------------------------------------
            # Credentials come straight from the Crossplane connection secret
            # written by crossplane/oidc-agentgateway.yaml. The key names are
            # the provider's, hence the `attribute.` prefix.
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: OAUTH_PROVIDER_NAME
              value: Zitadel
            - name: OPENID_PROVIDER_URL
              value: https://rpcu-gabeck.eu1.zitadel.cloud/.well-known/openid-configuration
            - name: OPENID_REDIRECT_URI
              value: https://chat.rpcu.io/oauth/oidc/callback
            - name: OAUTH_SCOPES
              value: openid email profile
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: agentgateway-oidc
                  key: attribute.client_id
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentgateway-oidc
                  key: attribute.client_secret
            # Safe here only because Zitadel is the single IdP and it verifies
            # addresses. Open WebUI itself does NOT check `email_verified`.
            - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
              value: "true"

            # ---- Role mapping ----------------------------------------------
            # Reuses the argus-owned `groupsClaim` Zitadel Action, the same
            # claim agentgateway used to authorize on. Without
            # ENABLE_OAUTH_ROLE_MANAGEMENT every user silently lands on the
            # default role regardless of their grants.
            #
            # Note this is strictly synchronising: a user is REMOVED from any
            # role not present in their claim at each login, and changes only
            # take effect on re-login.
            - name: ENABLE_OAUTH_ROLE_MANAGEMENT
              value: "true"
            - name: OAUTH_ROLES_CLAIM
              value: groups
            - name: OAUTH_ALLOWED_ROLES
              value: rpcu-admin,public-admin,public-user
            - name: OAUTH_ADMIN_ROLES
              value: rpcu-admin,public-admin

            # ---- Group sync: OIDC claim -> internal Groups ------------------
            # Required for {{USER_GROUPS}} (below) to expand to anything. Group
            # MANAGEMENT gates the sync itself; without it update_user_groups is
            # never called and the header is permanently empty. Group CREATION
            # auto-creates a Group whose name is the verbatim claim string, so
            # "rpcu-admin" in Zitadel becomes the Group "rpcu-admin" here —
            # without it, only groups hand-created in the admin UI are assigned.
            #
            # ⚠️ Sync happens at LOGIN ONLY. A Zitadel group change does not
            # take effect until the user logs out and back in.
            - name: ENABLE_OAUTH_GROUP_MANAGEMENT
              value: "true"
            - name: ENABLE_OAUTH_GROUP_CREATION
              value: "true"
            - name: OAUTH_GROUPS_CLAIM
              value: groups

            # ---- Local accounts --------------------------------------------
            # Hide the password form so SSO is the only offered path, but do NOT
            # set ENABLE_PASSWORD_AUTH=false: that disables password login in
            # the backend too and is a hard lockout if OIDC ever breaks. This
            # way the form is merely hidden and remains reachable at
            # /auth?form=true as a break-glass.
            - name: ENABLE_LOGIN_FORM
              value: "false"
            - name: ENABLE_SIGNUP
              value: "false"

            # ---- Upstream model API ----------------------------------------
            # Points at the agentgateway Service in this namespace over its
            # OpenAI-compatible surface (/v1/chat/completions). The gateway
            # converts that to Anthropic's /v1/messages and injects the real
            # Claude credential (backends.yaml), so Open WebUI never sees it and
            # prompt enrichment, metrics and the rate limit all still apply.
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: ENABLE_OPENAI_API
              value: "true"
            - name: OPENAI_API_BASE_URL
              value: http://llm.agentgateway-system.svc:80/v1
            # The gateway requires no credential from Open WebUI (it injects the
            # Anthropic one itself). Open WebUI still sends a bearer token, so
            # this is a placeholder rather than an empty string.
            - name: OPENAI_API_KEY
              value: unused

            # ---- Forwarding the caller's identity to the gateway ------------
            # THIS IS WHAT MAKES PER-GROUP RATE LIMITING POSSIBLE.
            #
            # Without it, every request reaches agentgateway as "Open WebUI",
            # one identity, and the only enforceable budget is a single global
            # one. With it, the gateway can key its rate limit counters on the
            # end user (see policy-ratelimit.yaml).
            #
            # Sends X-OpenWebUI-User-{Id,Email,Name,Role}. Two caveats:
            #   - User-Id is Open WebUI's internal UUID4, NOT the Zitadel `sub`.
            #     Stable per user, but it will not correlate with Zitadel logs.
            #   - User-Role is Open WebUI's OWN role — only admin/user/pending —
            #     NOT the Zitadel group. That is why the groups come separately,
            #     via the custom header below.
            - name: ENABLE_FORWARD_USER_INFO_HEADERS
              value: "true"

            # Per-connection custom header carrying the real Zitadel groups.
            # {{USER_GROUPS}} expands to a comma-joined list of the user's
            # internal Group NAMES, which the OIDC sync above makes identical to
            # the Zitadel claim values: "rpcu-admin,public-admin".
            #
            # The "0" key is this connection's index in OPENAI_API_BASE_URLS.
            # The singular OPENAI_API_BASE_URL above feeds that list, so a single
            # connection lands at index 0.
            #
            # ⚠️ STRICT JSON. A trailing comma or comment makes Open WebUI log a
            # warning and fall back to {} — the header then silently never gets
            # sent, which looks exactly like a gateway-side bug.
            #
            # ⚠️ ORDER IS NONDETERMINISTIC (groups come back updated_at DESC),
            # and a user with no groups yields an EMPTY STRING with the header
            # still present. Never exact-match the whole value downstream; test
            # for membership. policy-ratelimit.yaml does exactly that.
            - name: OPENAI_API_CONFIGS
              value: '{"0":{"enable":true,"headers":{"X-OpenWebUI-User-Groups":"{{USER_GROUPS}}"}}}'

            # ---- Cookies behind a TLS-terminating proxy ---------------------
            - name: WEBUI_AUTH_COOKIE_SAME_SITE
              value: lax
            - name: WEBUI_AUTH_COOKIE_SECURE
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: agentgateway-system
spec:
  selector:
    app: open-webui
  ports:
    - name: http
      port: 80
      targetPort: http
