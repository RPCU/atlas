# Prompt enrichment: system prompts that every request gets, managed centrally
# instead of being copy-pasted into each client.
#
# `prepend` inserts these messages BEFORE the caller's own messages, so a client
# that sends its own system prompt still gets it — both are present, ours first.
# Use `append` instead for instructions that should win over the caller's.
#
# This targets the HTTPRoute rather than the Gateway so the enrichment can later
# differ per provider or per route (e.g. a stricter preamble on a cheap model)
# without touching the auth/budget policy.
#
# Constraint from the API: prompt enrichment only applies to route types that
# agentgateway parses as chat, which is why backends.yaml maps
# /v1/chat/completions -> Completions. The `*` -> Passthrough catch-all in that
# same file is opaque to the gateway and cannot be enriched — so a client that
# calls some other path gets no system prompt at all.
#
# THIS IS THE CUSTOMIZATION POINT — edit the content below to taste. Keep it
# short: every token here is prepended to every request, and on CPU inference
# every extra token in the prompt is time the user waits.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: llm-prompt
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: llm
  backend:
    ai:
      prompt:
        prepend:
          - role: system
            content: >-
              You are a concise assistant. Answer directly in the fewest words
              needed. Give the answer first; skip preamble, restating the
              question, and step-by-step reasoning unless asked. If you don't
              know, say so in one sentence. Be accurate, not agreeable.
