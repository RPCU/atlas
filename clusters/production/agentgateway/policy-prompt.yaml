# Prompt enrichment: a house system prompt prepended to every request.
#
# `prepend` inserts these messages BEFORE the caller's own, so a client that
# sends its own system prompt still gets it — both are present, ours first.
#
# The first entry used to be the verbatim Claude Code identity line
# ("You are Claude Code, Anthropic's official CLI for Claude."), the third leg
# of the subscription-token spoof. It left with the Gemini swap — see the
# DISABLED banner in policy-claude-code.yaml, whose headers were the other two
# legs. Only the house instructions below remain.
#
# Constraint from the API: prompt enrichment only applies to route types the
# gateway parses as chat, which is why backends.yaml maps /v1/chat/completions
# -> Completions. A `*` -> Passthrough route is opaque and cannot be enriched —
# moving the chat path there would silently drop this prompt. Open WebUI uses
# /v1/chat/completions, so it is enriched.
#
# This targets the HTTPRoute rather than the Gateway so enrichment can later
# differ per route without touching the auth/budget policy.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: llm-prompt
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: llm
  backend:
    ai:
      prompt:
        prepend:
          # House instructions.
          - role: system
            content: >-
              You are accessed through the RPCU shared LLM gateway. Prefer
              precise, technically accurate answers over agreeable ones, and say
              plainly when something is unknown or uncertain rather than
              guessing.
