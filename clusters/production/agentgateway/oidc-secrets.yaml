# OIDC cookie encryption key for the built-in chat UI.
#
# Agentgateway requires this value to encrypt session cookies whenever an OIDC
# policy is configured, and refuses to start without it.
#
# Vault path: secrets-production/agentgateway/oidc, key: cookieSecret
# Generate with: openssl rand -hex 32
# **Populate the Vault path out of band before first deploy.**
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-ui-secrets
  namespace: agentgateway-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: agentgateway-ui-secrets
    creationPolicy: Owner
  data:
    - secretKey: OIDC_COOKIE_SECRET
      remoteRef:
        key: secrets-production/agentgateway/oidc
        property: cookieSecret
