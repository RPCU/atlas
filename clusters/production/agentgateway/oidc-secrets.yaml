# OIDC cookie encryption key for the built-in chat UI.
#
# OIDC_COOKIE_SECRET is an AES-256-GCM key: 32 random bytes encoded as 64
# hexadecimal characters. Agentgateway refuses to start when an OIDC policy is
# configured and this key is missing.
#
# Generate with: openssl rand -hex 32
# **Populate out of band before first deploy.**
apiVersion: v1
kind: Secret
metadata:
  name: agentgateway-ui-secrets
  namespace: agentgateway-system
type: Opaque
stringData:
  OIDC_COOKIE_SECRET: "REPLACE_ME_WITH_openssl_rand_hex_32"
