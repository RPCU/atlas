# OIDC cookie encryption key for the built-in chat UI.
#
# Uses a Password generator (required by ESO admission: data or dataFrom must be
# present) + a template that generates the real value with randBytes. The
# generator output is intentionally unused — randBytes produces the actual
# 64-hex-char AES-256-GCM key.
#
# refreshInterval "0h0m0s" = sync only once. Regenerating the cookie secret
# would invalidate every active session.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-ui-secrets
  namespace: agentgateway-system
spec:
  refreshInterval: "0h0m0s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: agentgateway-ui-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OIDC_COOKIE_SECRET: "{{ randBytes 32 | printf \"%x\" }}"
  # Satisfies ESO admission (data or dataFrom required). The generated password
  # is unused — the template produces the real value from randBytes.
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: agentgateway-cookie-gen
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: agentgateway-cookie-gen
  namespace: agentgateway-system
spec:
  passwordSpec:
    length: 32
    digits: 0
    symbols: 0
    noUpper: true
    allowRepeat: true
