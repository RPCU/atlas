# OIDC cookie encryption key for the built-in chat UI.
#
# Generated once by ESO on first create. refreshInterval: 0 ensures the value
# is never regenerated (regenerating would invalidate all active sessions).
# If the Secret is deleted and recreated, a new value is generated.
#
# OIDC_COOKIE_SECRET must be a 64-hex-char string (AES-256-GCM key).
# Agentgateway refuses to start when an OIDC policy is configured and this
# key is missing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway-ui-secrets
  namespace: agentgateway-system
spec:
  # Never refresh: the cookie secret is generated once and kept forever.
  # Regenerating it would invalidate every active session.
  refreshInterval: 0
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: agentgateway-ui-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # 32 random bytes → 64 hex characters
        OIDC_COOKIE_SECRET: "{{ randBytes 32 | printf \"%x\" }}"
