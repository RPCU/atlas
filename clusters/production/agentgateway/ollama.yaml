# Local CPU inference. This is the only LLM backend behind the gateway.
#
# There is no GPU on this cluster, so everything here is sized for CPU-bound
# generation: one model resident in RAM, one request at a time. Expect single
# digit tokens/sec — fine for a handful of interactive users through Open WebUI,
# not something to point a batch job at.
#
# Model choice: llama3.2:1b, ~0.8GB quantised (Q8_0). On a CPU node, token
# generation is MEMORY-BANDWIDTH bound — each token streams the whole weight set
# through RAM once, so tokens/sec ≈ mem_bandwidth ÷ bytes_per_token. A ~1B model
# moves roughly a third of the bytes of qwen3:4b, so it is the fastest usable
# option here. It is also NOT a reasoning model: unlike qwen3 it answers directly
# instead of burning tokens "thinking", which matters far more than raw tok/s for
# how fast a reply *feels*. This node is 6 vCPU with dual-channel DDR4; do not
# expect "instant" (that needs a GPU) — expect a few tokens/sec, readable live.
#
# Ollama's OpenAI-compatible surface (/v1/*) is what agentgateway talks to; its
# native /api/* surface is only used by the probes and the init container. The
# Service is ClusterIP and there is no HTTPRoute — nothing outside the cluster
# reaches Ollama directly, it is always fronted by the gateway.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: agentgateway-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: agentgateway-system
spec:
  replicas: 1
  # RWO volume + a model that must be exclusively memory-resident: never run two
  # of these at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      # Pull the model BEFORE the server accepts traffic, rather than in a
      # postStart hook. A postStart hook races the readiness probe: the gateway
      # would start routing while the weights are still downloading and every
      # request would 404 on an unknown model. This blocks instead, and is a
      # cheap no-op on restart once the layers are on the PVC.
      initContainers:
        - name: pull-model
          image: alpine/ollama:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              ollama serve &
              pid=$!
              until ollama list >/dev/null 2>&1; do sleep 1; done
              ollama pull llama3.2:1b
              kill "$pid"
              wait "$pid" 2>/dev/null || true
          env:
            - name: OLLAMA_HOST
              value: 127.0.0.1:11434
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      containers:
        - name: ollama
          image: alpine/ollama:latest
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            # Keep the weights resident. On CPU a cold load costs tens of
            # seconds, which reads as a hang in the Open WebUI chat box.
            - name: OLLAMA_KEEP_ALIVE
              value: 24h
            # One model, one request at a time. Concurrency on 2.6 shared cores
            # makes every request slower without raising throughput, and each
            # parallel slot allocates its own KV cache.
            - name: OLLAMA_MAX_LOADED_MODELS
              value: '1'
            - name: OLLAMA_NUM_PARALLEL
              value: '1'
            # The node is 6 vCPU but ~1 core is taken by kubelet/Cilium/CSI, so
            # inference only ever gets ~5 cores. Pin threads to 5: asking for 6
            # just adds context-switching against the system daemons and slows
            # generation (which is bandwidth-bound anyway, not thread-bound).
            - name: OLLAMA_NUM_THREADS
              value: '5'
            # Cap context so a single runaway request cannot grow unbounded and
            # hold the one inference slot forever (with NUM_PARALLEL=1 that stalls
            # every other user). 4096 is plenty for interactive chat.
            - name: OLLAMA_CONTEXT_LENGTH
              value: '4096'
          ports:
            - name: http
              containerPort: 11434
          # Generous thresholds on purpose: while a generation is running the
          # server is CPU-starved and can be slow to answer even a trivial probe.
          # A tight liveness probe here would restart the pod mid-answer.
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 6
          resources:
            requests:
              # Match OLLAMA_NUM_THREADS so the scheduler reserves the cores the
              # inference threadpool will actually use. No CPU limit — CPU is the
              # product here and a limit only throttles; memory is capped instead.
              cpu: '5'
              memory: 2Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: agentgateway-system
spec:
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
