# Session signing key for Open WebUI.
#
# WEBUI_SECRET_KEY signs session JWTs and encrypts the OAuth tokens Open WebUI
# stores at rest. If it is unset the image generates one into the CONTAINER
# filesystem (not the PVC), so it would change on every pod restart and log
# everybody out — and any stored OAuth token would become undecryptable.
#
# Populate out of band, once:
#   vault kv put secrets-production/openwebui/config secretKey="$(openssl rand -hex 32)"
#
# Rotating this value is a deliberate act: it invalidates every active session.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-secrets
  namespace: agentgateway-system
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: open-webui-secrets
  data:
    - secretKey: secret-key
      remoteRef:
        key: secrets-production/openwebui/config
        property: secretKey
