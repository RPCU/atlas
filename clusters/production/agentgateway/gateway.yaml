# The agentgateway data plane for LLM traffic.
#
# This Gateway uses the "agentgateway" GatewayClass (installed by
# infrastructure/agentgateway), NOT "kgateway". The agentgateway controller's
# deployer watches it and provisions a matching proxy Deployment + Service, both
# named "llm", in this namespace.
#
# The Service is ClusterIP and there is NO public HTTPRoute pointing at it.
# That is a security control, not an oversight: this proxy no longer
# authenticates anything (see policy-gateway.yaml), so its only protection is
# being unreachable from outside the cluster. Open WebUI is the authenticated
# front door and the sole client.
#
#   internet -> https-external (kgateway, 172.16.255.10, TLS terminate)
#            -> open-webui  (Zitadel OIDC login)
#            -> Service llm:80 (this proxy, ClusterIP)
#            -> AgentgatewayBackend anthropic -> api.anthropic.com
#               (Claude credential injected here — see backends.yaml)
#
# allowedRoutes is "Same" for the same reason: widening it would let any
# namespace in the cluster attach a route to an unauthenticated LLM endpoint.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: llm
  namespace: agentgateway-system
spec:
  logging:
    format: json
  # First install, so there is no Mimir history to size against. Follows the
  # house rule: memory limit only, never a CPU limit (CPU is compressible; a
  # limit only throttles). Revisit once the proxy has a few days of traffic.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  deployment: {}
  service:
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: llm
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: llm
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
