# The agentgateway data plane for LLM traffic.
#
# This Gateway uses the "agentgateway" GatewayClass (installed by
# infrastructure/agentgateway), NOT "kgateway". The agentgateway controller's
# deployer watches it and provisions a matching proxy Deployment + Service, both
# named "llm", in this namespace.
#
# Traffic path:
#   internet -> https-external (kgateway, 172.16.255.10, TLS terminate)
#            -> chat.rpcu.io HTTPRoute -> open-webui:8080
#            -> Open WebUI (Zitadel OIDC browser login, serves chat UI)
#            -> llm:80 (LLM API proxy, global rate limiting)
#            -> AgentgatewayBackend anthropic -> api.anthropic.com
#
# The llm Gateway has NO auth, NO OIDC, NO per-group rate limiting.
# Open WebUI handles authentication. The Gateway only does global rate limiting.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: llm
  namespace: agentgateway-system
spec:
  logging:
    format: json
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  deployment: {}
  service:
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: llm
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: llm
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
