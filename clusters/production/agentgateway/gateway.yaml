# The agentgateway data plane for LLM traffic AND the built-in chat UI.
#
# This Gateway uses the "agentgateway" GatewayClass (installed by
# infrastructure/agentgateway), NOT "kgateway". The agentgateway controller's
# deployer watches it and provisions a matching proxy Deployment + Service, both
# named "llm", in this namespace.
#
# The Service exposes three ports:
#   80     — LLM traffic (OpenAI-compatible /v1/chat/completions)
#   15000  — Built-in chat UI (admin port, served by the proxy)
#
# Traffic path:
#   internet -> https-external (kgateway, 172.16.255.10, TLS terminate)
#            -> Service llm:15000 (this proxy, ClusterIP, built-in UI)
#            -> JWT auth (Zitadel JWKS, configured in rawConfig)
#            -> authorization (group-based allow via CRD policy)
#            -> user sees chat UI, picks model, sends message
#            -> proxy -> AgentgatewayBackend anthropic -> api.anthropic.com
#               (Claude credential injected here — see backends.yaml)
#
# Two Gateways in series, each doing what it is good at:
#   https-external (kgateway)  -> public IP, Let's Encrypt wildcard *.rpcu.io,
#                                 Cloudflare DNS record via ExternalDNS
#   llm (agentgateway)         -> OIDC login, JWT auth, token budgets,
#                                 prompt enrichment, provider routing
#
# CRD v2.2.1 limitations: the AgentgatewayPolicy CRD does not have
# traffic.oidc, traffic.jwtAuthentication.jwks.remote.url, or
# frontend.metrics. Those go in rawConfig which is merged into the proxy's
# upstream config file. CRD policies handle what they can (authorization,
# rateLimit, transformation).
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: llm
  namespace: agentgateway-system
spec:
  logging:
    format: json
  # First install, so there is no Mimir history to size against. Follows the
  # house rule: memory limit only, never a CPU limit (CPU is compressible; a
  # limit only throttles). Revisit once the proxy has a few days of traffic.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  # JWT auth is configured via rawConfig because the CRD doesn't expose
  # it as a policy field (jwks.remote.url not in CRD v2.2.1). rawConfig is
  # merged into the proxy's upstream config file alongside CRD-generated config.
  #
  # IMPORTANT: the Kubernetes proxy config only accepts these top-level keys:
  #   config, binds, frontendPolicies, policies, workloads, services, backends
  # The standalone keys (gateways, ui, routes, llm, mcp) are NOT valid here —
  # the controller generates those from Gateway API resources. So JWT auth goes
  # into the `policies` array as a LocalPolicy item targeting the llm Gateway.
  #
  # NOTE: OIDC browser auth (oidc field) is NOT available in rawConfig.policies
  # on proxy v0.12.0 — the FilterOrPolicy schema in this version does not
  # include it. OIDC is only available inline on gateway listeners, which the
  # controller generates. The built-in chat UI is protected by JWT auth +
  # network isolation (ClusterIP, allowedRoutes: Same) instead.
  rawConfig:
    policies:
      # --- Gateway-level JWT auth (for API calls too) ---
      - name:
          name: llm-jwt
          namespace: agentgateway-system
        target:
          gateway:
            gatewayName: llm
            gatewayNamespace: agentgateway-system
        phase: gateway
        policy:
          jwtAuth:
            mode: strict
            providers:
              - issuer: https://rpcu-gabeck.eu1.zitadel.cloud
                jwks:
                  url: https://rpcu-gabeck.eu1.zitadel.cloud/oauth/v2/keys
  # JWT secret: client_id/client_secret from the Crossplane Oidc app's
  # connection secret (kept for potential future use; not consumed by rawConfig
  # since OIDC browser auth is not available on proxy v0.12.0).
  env:
    - name: AGW_OIDC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: agentgateway-oidc
          key: attribute.client_id
    - name: AGW_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: agentgateway-oidc
          key: attribute.client_secret
    - name: OIDC_COOKIE_SECRET
      valueFrom:
        secretKeyRef:
          name: agentgateway-ui-secrets
          key: OIDC_COOKIE_SECRET
  deployment: {}
  service:
    spec:
      type: ClusterIP
      # Add port 15000 for the built-in chat UI alongside the deployer's
      # default ports (80/443). The deployer creates the Service; this patch
      # adds the UI port via strategic merge.
      ports:
        - name: ui
          port: 15000
          targetPort: 15000
          protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: llm
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: llm
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: ui
      port: 15000
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
