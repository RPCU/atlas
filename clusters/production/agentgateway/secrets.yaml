# Upstream provider credentials. One Secret per provider, each holding a single
# "Authorization" key — that is the key agentgateway's policies.auth.secretRef
# reads by default. For the anthropic provider agentgateway rewrites it into the
# "x-api-key" header that the Anthropic API expects; no extra config needed.
#
# Callers never see these. Clients authenticate to the gateway with a Zitadel
# JWT (policy-gateway.yaml); the gateway swaps that for the real provider key.
# That is the whole point of putting a gateway here: one paid credential, many
# users, per-user accounting.
#
# Populate Vault out of band:
#   vault kv put secrets-production/agentgateway/anthropic apiKey=sk-ant-...
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anthropic-credentials
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: anthropic-credentials
  data:
    - secretKey: Authorization
      remoteRef:
        key: secrets-production/agentgateway/anthropic
        property: apiKey
