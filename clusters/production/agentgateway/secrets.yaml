# Upstream Anthropic credential.
#
# One Secret holding a single "Authorization" key — that is the key
# agentgateway's policies.auth.secretRef reads by default, and for the Anthropic
# provider agentgateway injects it as `Authorization: Bearer <token>`.
#
# TWO CREDENTIAL TYPES CAN LIVE HERE, and agentgateway v1.5+ tells them apart by
# prefix (crates/llm/src/anthropic.rs `OAUTH_TOKEN_PREFIX = "sk-ant-oat"`):
#
#   sk-ant-api...  — a pay-as-you-go API key. agentgateway rewrites it into the
#                    `x-api-key` header Anthropic expects. Nothing else needed.
#   sk-ant-oat...  — a CLAUDE SUBSCRIPTION OAuth token (Pro/Max seat). Here
#                    agentgateway keeps `Authorization: Bearer` and drops
#                    `x-api-key`. BUT the subscription is only accepted by
#                    Anthropic for Sonnet/Opus if the request also looks like it
#                    came from Claude Code — that spoofing is done in
#                    backends.yaml (headers) + policy-prompt.yaml (system
#                    preamble), NOT here. See the note at the top of backends.yaml.
#
# Callers never see this credential. They authenticate to Open WebUI with
# Zitadel OIDC; Open WebUI talks to the gateway unauthenticated over ClusterIP;
# the gateway swaps in this one real Anthropic credential. One paid seat, many
# users.
#
# Populate Vault out of band with WHICHEVER token you have:
#   vault kv put secrets-production/agentgateway/anthropic apiKey=sk-ant-oat...
# (a subscription OAuth token is obtained by running `claude setup-token` in a
# logged-in Claude Code CLI; a plain API key comes from the Anthropic console.)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anthropic-credentials
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: anthropic-credentials
  data:
    - secretKey: Authorization
      remoteRef:
        key: secrets-production/agentgateway/anthropic
        property: apiKey
