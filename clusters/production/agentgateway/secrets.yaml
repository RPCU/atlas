# Upstream Gemini credential.
#
# One Secret holding a single "Authorization" key — that is the key
# agentgateway's policies.auth.secretRef reads by default (a non-AWS secretRef
# MUST use `Authorization`), and for the gemini provider agentgateway uses it as
# the API key against generativelanguage.googleapis.com.
#
# Callers never see this credential. They authenticate to Open WebUI with
# Zitadel OIDC; Open WebUI talks to the gateway unauthenticated over ClusterIP;
# the gateway swaps in this one real Gemini key. One key, many users.
#
# Populate Vault out of band BEFORE this reconciles — an empty path means the
# Secret is never created and every request 401s:
#   vault kv put secrets-production/agentgateway/gemini apiKey=<AI Studio key>
# (a Gemini API key is created in Google AI Studio -> API Keys.)
#
# The old Anthropic path secrets-production/agentgateway/anthropic is left in
# place on purpose, and policy-claude-code.yaml is kept (disabled), so flipping
# the backend back to Anthropic does not require hunting for the credential.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gemini-credentials
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gemini-credentials
  data:
    - secretKey: Authorization
      remoteRef:
        key: secrets-production/agentgateway/gemini
        property: apiKey
