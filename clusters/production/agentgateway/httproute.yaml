# Routing on the agentgateway proxy itself.
#
# There is exactly one backend (anthropic), so this is a catch-all: every path
# on the internal `llm` Gateway goes to the Anthropic backend, which decides
# how to parse it from backends.yaml's `routes` map (/v1/chat/completions from
# Open WebUI -> Completions -> converted to Anthropic /v1/messages).
#
# This route is only reachable from inside the cluster. The `llm` Gateway is
# ClusterIP and, since authentication lives in Open WebUI (chat.rpcu.io), there
# is deliberately NO public HTTPRoute pointing at it. Adding one would put an
# unauthenticated, credential-injecting LLM endpoint on the internet — re-add
# jwtAuthentication to policy-gateway.yaml first if you ever need that.
#
# ADDING A SECOND PROVIDER later means re-introducing content-based routing:
# a PreRouting AgentgatewayPolicy that lifts `model` out of the JSON body into
# an x-model header, then a specific header match ABOVE this catch-all (Gateway
# API picks the more specific match, so the catch-all can stay last):
#
#   - matches:
#       - path: {type: PathPrefix, value: /}
#         headers:
#           - {type: RegularExpression, name: x-model, value: "^gpt-.*"}
#     backendRefs:
#       - {name: openai, group: agentgateway.dev, kind: AgentgatewayBackend}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: llm
      namespace: agentgateway-system
      sectionName: http
  rules:
    - backendRefs:
        - name: anthropic
          group: agentgateway.dev
          kind: AgentgatewayBackend
