# Routing on the agentgateway proxy itself.
#
# There is exactly one backend now, so this is a catch-all and nothing more.
#
# The previous version matched an `x-model` header that a PreRouting policy
# lifted out of the JSON body, so that a caller picked its provider implicitly
# just by naming a model. That machinery only earns its keep with two or more
# providers; with a single Ollama behind it, it added a failure mode (an
# unrecognised model 404'd at the gateway) and nothing else. policy-prerouting
# .yaml was deleted along with it.
#
# BRINGING IT BACK when a second provider appears means re-adding the PreRouting
# policy and putting the specific header match ABOVE this rule — Gateway API
# picks the more specific match, so a catch-all can safely stay last:
#
#   - matches:
#       - path: {type: PathPrefix, value: /}
#         headers:
#           - {type: RegularExpression, name: x-model, value: "^claude-.*"}
#     backendRefs:
#       - {name: anthropic, group: agentgateway.dev, kind: AgentgatewayBackend}
#
# This route is only reachable from inside the cluster. The Gateway is ClusterIP
# and, since authentication moved to Open WebUI, there is deliberately no public
# HTTPRoute pointing at it.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: llm
      namespace: agentgateway-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ollama
          group: agentgateway.dev
          kind: AgentgatewayBackend
