# The LLM backend: Anthropic (Claude), reached with ONE shared credential from
# secrets.yaml. Open WebUI (and any OpenAI-SDK client) calls the gateway on
# /v1/chat/completions; agentgateway converts that to Anthropic's /v1/messages
# and injects the credential.
#
# ---- MAKING A CLAUDE *SUBSCRIPTION* WORK (issue agentgateway#2297) ----------
# There are two kinds of Anthropic credential and they are NOT interchangeable:
#
#   sk-ant-api...  A pay-as-you-go API key. Works out of the box: agentgateway
#                  puts it in the `x-api-key` header and Anthropic bills usage.
#
#   sk-ant-oat...  A Claude Pro/Max SUBSCRIPTION OAuth token (from
#                  `claude setup-token`). agentgateway v1.5+ already detects the
#                  `sk-ant-oat` prefix and keeps it as `Authorization: Bearer`
#                  instead of `x-api-key` (crates/llm/src/anthropic.rs +
#                  llm/mod.rs set_required_fields). That part is automatic.
#
#                  What is NOT automatic — and what issue #2297 is about — is
#                  that Anthropic only honours a subscription token for Sonnet /
#                  Opus when the request looks like it came from the Claude Code
#                  CLI. Three things make it look that way:
#                    1. headers anthropic-beta / user-agent / x-app  (set in
#                       policy-claude-code.yaml via transformation)
#                    2. the FIRST system message must be exactly
#                       "You are Claude Code, Anthropic's official CLI for
#                        Claude." — injected by policy-prompt.yaml's `prepend`.
#                  Miss any one and Anthropic returns 401/403 on Sonnet/Opus
#                  (Haiku is more lenient, which makes this easy to misdiagnose).
#
# These headers are harmless with a plain sk-ant-api key too (Anthropic ignores
# anthropic-beta/user-agent for keyed requests), so the same manifest works for
# BOTH credential types — swap only the Vault value.
#
# NOTE: provider.anthropic.model PINS every request to claude-haiku-4-5, the
# cheapest / least-token-consuming current Claude model ($1/$5 per MTok, 200K
# ctx). This overrides whatever the caller (Open WebUI's picker) asked for.
# Remove the `model:` line to let the request body choose again.
# policies.ai.routes maps URL path suffixes (ends-with) to the API shape the
# gateway should parse:
#   /v1/messages          -> Anthropic native (Claude Code, Anthropic SDK)
#   /v1/chat/completions  -> OpenAI-compatible (Open WebUI, LangChain, OpenAI SDK)
# Serving both dialects on one host is what lets Open WebUI (OpenAI shape) and a
# raw Claude Code client (Anthropic shape) share this one backend.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: anthropic
  namespace: agentgateway-system
spec:
  ai:
    provider:
      anthropic:
        # Cheapest / least-token-consuming current Claude model. Pinning it here
        # overrides the client's requested model. See the note above.
        model: claude-opus-4-8
  policies:
    # auth:
    #   secretRef:
    #     name: anthropic-credentials
    ai:
      routes:
        '/v1/messages': 'Messages'
        '/v1/messages/count_tokens': 'AnthropicTokenCount'
        # '/v1/chat/completions': 'Completions'
        # '/v1/models': 'Models'
        '*': 'Passthrough'
