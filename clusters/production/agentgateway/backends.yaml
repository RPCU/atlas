# The LLM backend: Google Gemini, reached with ONE shared credential from
# secrets.yaml. Open WebUI (and any OpenAI-SDK client) calls the gateway on
# /v1/chat/completions; agentgateway converts that to Gemini's native
# generateContent endpoint and injects the credential.
#
# ---- CREDENTIAL -------------------------------------------------------------
# One AI Studio API key (<https://aistudio.google.com/app/apikey>), stored in
# Vault at secrets-production/agentgateway/gemini (property `apiKey`) and
# surfaced as the `gemini-credentials` Secret. The gateway reads it from
# policies.auth.secretRef — `Authorization` is the ONLY key the CRD accepts for
# a non-AWS secretRef, which is what secrets.yaml produces.
#
# ---- MODEL PIN --------------------------------------------------------------
# NOTE: provider.gemini.model PINS every request to gemini-2.5-flash, which
# overrides whatever the caller (Open WebUI's picker) asked for. Remove the
# `model:` line to let the request body choose again.
#
# ---- ROUTES -----------------------------------------------------------------
# policies.ai.routes maps URL path suffixes (ends-with) to the API shape the
# gateway should parse:
#   /v1/chat/completions  -> Completions   (Open WebUI, LangChain, OpenAI SDK)
#   *                     -> Passthrough   (everything else, forwarded as-is)
# Serving the OpenAI dialect on one host is what lets Open WebUI share this one
# backend with any other OpenAI-SDK client.
#
# `Completions` is load-bearing: it is the route type agentgateway actually
# parses, and parsing is what unlocks prompt enrichment (policy-prompt.yaml),
# token counting for the rate limit (policy-ratelimit.yaml, `unit: Tokens`) and
# cost metrics. `Passthrough` applies NO policies at all — never move
# /v1/chat/completions onto it.
#
# The Anthropic-native routes that used to live here (/v1/messages,
# /v1/messages/count_tokens) are gone: Gemini has no equivalent. So is the
# Claude Code identity spoof — policy-claude-code.yaml is disabled in
# kustomization.yaml (the file is kept for a flip back to Anthropic).
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: gemini
  namespace: agentgateway-system
spec:
  ai:
    provider:
      gemini:
        # Pin overrides the client's requested model. See the note above.
        model: gemini-2.5-flash
  policies:
    auth:
      secretRef:
        name: gemini-credentials
    ai:
      routes:
        '/v1/chat/completions': 'Completions'
        # '/v1/models': 'Passthrough'
        '*': 'Passthrough'
