# The LLM backend. One AgentgatewayBackend per provider.
#
# This used to be Anthropic over a paid API key. It is now the in-cluster Ollama
# from ollama.yaml, which changes two things worth knowing:
#   - there is no credential, so there is no `policies.auth` and no Vault path
#   - there is no per-token cost, so the budgets downstream exist to protect CPU,
#     not a bill
#
# `custom` is the provider type for a self-hosted, non-managed endpoint: the
# target and the API shapes are declared explicitly instead of being inferred
# from a managed provider name. `backendRef` may only point at a Service in THIS
# namespace, which is why ollama lives in agentgateway-system rather than in an
# app namespace of its own.
#
# No `model:` is pinned anywhere. The model name is taken from the request body
# and passed through to Ollama, so pulling a second model into the PVC is enough
# to make it selectable in Open WebUI — no manifest change here.
#
# ADDING A REAL PROVIDER LATER is still the same three edits it always was:
# a Secret, another AgentgatewayBackend, and a matching rule in httproute.yaml.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: ollama
  namespace: agentgateway-system
spec:
  ai:
    provider:
      custom:
        backendRef:
          name: ollama
          port: 11434
        # Ollama's OpenAI-compatible surface. These are the upstream paths
        # agentgateway rewrites to; they are NOT the paths clients call.
        formats:
          - type: Completions
            path: /v1/chat/completions
          - type: Embeddings
            path: /v1/embeddings
        # Labels telemetry and cost-catalog lookups as "ollama" instead of the
        # default "custom", so the metrics stay readable if a second self-hosted
        # provider ever lands here.
        providerOverride: ollama
  policies:
    ai:
      # Keys are URL path suffixes (ends-with), matched against what the CLIENT
      # asked for. `*` is the catch-all: Open WebUI probes /v1/models to
      # enumerate what it can offer, and Passthrough hands that straight to
      # Ollama, which answers it natively.
      routes:
        "/v1/chat/completions": "Completions"
        "/v1/embeddings": "Embeddings"
        "*": "Passthrough"
