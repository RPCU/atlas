apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentgateway-system
resources:
  # LLM gateway (Anthropic backend + its Vault-backed credential).
  # The llm Gateway has NO auth — Open WebUI handles authentication.
  - secrets.yaml
  - gateway.yaml
  - backends.yaml
  - httproute.yaml
  - policy-claude-code.yaml
  - policy-prompt.yaml
  - ratelimit.yaml
  - podmonitor.yaml
  # Chat frontend: Open WebUI (Zitadel OIDC login, serves chat UI)
  - open-webui.yaml
  - open-webui-httproute.yaml
  - open-webui-secrets.yaml
