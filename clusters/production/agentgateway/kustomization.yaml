apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentgateway-system
resources:
  # LLM gateway (Anthropic backend + its Vault-backed credential + the Zitadel
  # JWKS backend). Auth is enforced by policy-gateway.yaml (JWT + authz + rate
  # limit) on the llm Gateway; the browser OIDC login is done by oauth2-proxy.
  - secrets.yaml
  - gateway.yaml
  - backends.yaml
  - httproute.yaml
  - policy-gateway.yaml
  - policy-claude-code.yaml
  - policy-prompt.yaml
  - ratelimit.yaml
  - podmonitor.yaml
  # Chat frontend: oauth2-proxy (Zitadel OIDC login) + the public HTTPRoute.
  - oauth2-proxy
  - chat-httproute.yaml
  # Internal route on the llm Gateway: forwards chat.rpcu.io to the admin UI
  # (127.0.0.1:15000, localhost-only). The llm proxy is in the same container
  # and CAN reach localhost; an external Service cannot.
  - chat-ui-route.yaml
