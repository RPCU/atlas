apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentgateway-system
resources:
  # LLM gateway (internal, unauthenticated — see policy-gateway.yaml)
  # Anthropic backend + its Vault-backed credential.
  - secrets.yaml
  - gateway.yaml
  - backends.yaml
  - httproute.yaml
  - policy-gateway.yaml
  - policy-prompt.yaml
  - ratelimit.yaml
  - podmonitor.yaml
  # Chat frontend (public, owns authentication)
  - open-webui-secrets.yaml
  - open-webui.yaml
  - open-webui-httproute.yaml
