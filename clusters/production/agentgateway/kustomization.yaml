apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentgateway-system
resources:
  # LLM gateway (Gemini backend + its Vault-backed credential).
  # The llm Gateway has NO auth — Open WebUI handles authentication.
  - secrets.yaml
  - gateway.yaml
  - backends.yaml
  - httproute.yaml
  - policy-ratelimit.yaml
  # policy-claude-code.yaml is DELIBERATELY absent: it injects the Claude Code
  # identity headers, which are Anthropic-only. It stays on disk (disabled) so a
  # flip back to Anthropic is a one-line re-add here.
  - policy-prompt.yaml
  - policy-models.yaml
  - ratelimit.yaml
  - podmonitor.yaml
  # Chat frontend: Open WebUI (Zitadel OIDC login, serves chat UI)
  - open-webui.yaml
  - open-webui-httproute.yaml
  - open-webui-secrets.yaml
