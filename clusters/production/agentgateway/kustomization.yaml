apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentgateway-system
resources:
  # LLM gateway (authenticated — JWT verified by llm Gateway before traffic reaches the proxy)
  # Anthropic backend + its Vault-backed credential.
  - secrets.yaml
  - oidc-secrets.yaml
  - gateway.yaml
  - backends.yaml
  - httproute.yaml
  - policy-claude-code.yaml
  - policy-prompt.yaml
  - ratelimit.yaml
  - podmonitor.yaml
  # Chat frontend (agentgateway built-in UI, public via https-external)
  - chat-httproute.yaml
