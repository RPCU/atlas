# Lifts the "model" field out of the JSON request body into an x-model header
# so that httproute.yaml can route on it.
#
# This MUST be a separate policy from policy-gateway.yaml and it MUST target the
# Gateway (not an HTTPRoute): PreRouting is a distinct execution phase that runs
# before route selection, and PreRouting rules never merge with PostRouting
# ones. Attached to an HTTPRoute the header would be set after the routing
# decision was already made — too late to influence it.
#
# coalesce() keeps this safe for requests with no body or no model field (a GET
# /v1/models probe, a malformed payload): those get an empty x-model, match no
# model-based rule, and fall through to the discovery rule or a 404 — rather
# than erroring the whole request in the transformation.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: llm-extract-model
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm
  traffic:
    phase: PreRouting
    transformation:
      request:
        set:
          - name: x-model
            value: 'coalesce(json(request.body).model, "")'
