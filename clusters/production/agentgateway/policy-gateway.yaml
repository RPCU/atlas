# Traffic policy for the LLM Gateway.
#
# ---- WHY THERE IS NO AUTHENTICATION HERE ----------------------------------
# This gateway used to run jwtAuthentication in Strict mode plus an
# authorization rule keyed on Zitadel group claims. That moved UP the stack:
# Open WebUI now owns identity (Zitadel OIDC, see open-webui.yaml), and the
# gateway sits BEHIND it on a ClusterIP Service with no public HTTPRoute.
#
# The security boundary is therefore the network, not a token. That is only
# sound as long as BOTH of these stay true:
#   1. the `llm` Gateway keeps `service.spec.type: ClusterIP` (gateway.yaml) and
#      `allowedRoutes.namespaces.from: Same`
#   2. nothing re-adds an HTTPRoute for it on the public `https-external`
#      Gateway
# If either changes, this becomes an open, unauthenticated LLM endpoint on the
# internet. Re-add jwtAuthentication before exposing it.
#
# Everything that targets this Gateway in the default (PostRouting) phase must
# stay in ONE policy: when two AgentgatewayPolicy resources target the same
# Gateway, one silently overwrites the other by creation order and BOTH still
# report ACCEPTED/ATTACHED. The only other policy touching this Gateway is
# policy-prompt.yaml, which targets the HTTPRoute rather than the Gateway.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: llm
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm
  traffic:
    # ---- Global spend ceiling -------------------------------------------
    # A single flat token counter for the whole gateway, not a per-user or
    # per-group budget. The per-identity tiers that used to live here were keyed
    # off `jwt.sub` and `jwt.groups`; authentication now lives in Open WebUI, so
    # the gateway sees no identity at this layer to key on, and a descriptor
    # whose CEL expression fails is silently SKIPPED — it would have enforced
    # nothing at all.
    #
    # With the Anthropic backend restored this is a MONEY ceiling again, not
    # just a CPU guardrail: every token here bills against the shared Anthropic
    # credential (a subscription seat or a pay-as-you-go key). Per-user fairness,
    # if it is ever wanted, belongs in Open WebUI where the user is known — or
    # re-add jwtAuthentication + tiered descriptors here (see git history of this
    # file for the pre-pivot version).
    rateLimit:
      global:
        domain: agentgateway
        backendRef:
          kind: Service
          name: ratelimit
          namespace: agentgateway-system
          port: 8081
        descriptors:
          # Constant key: every request lands in the same bucket. The value is
          # a literal rather than an expression so there is no way for it to
          # fail at request time and fall open.
          - entries:
              - name: global
                expression: '"all"'
            unit: Tokens
