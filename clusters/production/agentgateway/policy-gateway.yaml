# Gateway-level auth for the llm Gateway: JWT verification, group authorization,
# and per-group token-budget rate limiting. ALL of this is CRD-native
# (AgentgatewayPolicy.spec.traffic) and supported on the deployed proxy
# (v0.12.0 / chart v2.2.1). Do NOT move any of it into gateway.yaml rawConfig —
# hand-rolled rawConfig.policies crash the proxy (see gateway.yaml header).
#
# The Zitadel access token arrives here because oauth2-proxy (chat.rpcu.io front
# door) sets `pass_access_token = true`, so the browser session's token is
# forwarded upstream as `Authorization: Bearer <token>`. oauth2-proxy does the
# OIDC LOGIN (redirect/cookie); this policy does the TOKEN VERIFICATION and
# extracts jwt.groups / jwt.sub for authorization + rate limiting.
#
# ⚠️ ONE policy per Gateway+phase: when two AgentgatewayPolicy resources target
# the same Gateway, one silently overwrites the other (both report
# ACCEPTED/ATTACHED). Keep jwtAuthentication + authorization + rateLimit together
# in THIS single resource. policy-claude-code.yaml and policy-prompt.yaml target
# the HTTPRoute (not the Gateway), so they don't collide.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: llm
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm
  traffic:
    # ---- JWT authentication -------------------------------------------------
    # Validates the Zitadel access token forwarded by oauth2-proxy. The signing
    # keys are fetched from Zitadel's JWKS endpoint via the zitadel-jwks
    # AgentgatewayBackend (backends.yaml). Strict = a valid token is required.
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: https://rpcu-gabeck.eu1.zitadel.cloud
          jwks:
            remote:
              backendRef:
                group: agentgateway.dev
                kind: Backend
                name: zitadel-jwks
                namespace: agentgateway-system
                port: 443
              jwksPath: /oauth/v2/keys
              cacheDuration: 5m

    # ---- Authorization ------------------------------------------------------
    # A signature-valid JWT is not enough: the caller must actually hold one of
    # the org's roles. Every registered user is auto-granted `public-user` by the
    # argus `addUserGrant` Action, so in practice this admits every real user
    # while rejecting tokens minted for unrelated apps with no grants.
    authorization:
      action: Allow
      policy:
        matchExpressions:
          - '["rpcu-admin", "public-admin", "public-user"].exists(g, g in default(jwt.groups, []))'

    # ---- Token budgets ------------------------------------------------------
    # unit: Tokens means the cost debited per request is the LLM token count
    # (input + output), not 1. So `requests_per_unit` in the rate limit server
    # config (ratelimit.yaml) is literally a daily token budget.
    #
    # Two independent descriptors, hence two independent counters:
    #   1. [group, user_id] — each user's own budget, sized by their group.
    #   2. [group_total]    — a ceiling for the whole group combined.
    # The key names differ (group vs group_total) so the two descriptor trees in
    # the rate limit server config cannot collide.
    #
    # The group expression collapses the claim array to a single tier, highest
    # privilege wins. default() guards the case where the claim is absent.
    rateLimit:
      global:
        domain: agentgateway
        backendRef:
          kind: Service
          name: ratelimit
          namespace: agentgateway-system
          port: 8081
        descriptors:
          - entries:
              - name: group
                expression: '"rpcu-admin" in default(jwt.groups, []) ? "rpcu-admin" : ("public-admin" in default(jwt.groups, []) ? "public-admin" : "public-user")'
              - name: user_id
                expression: 'default(jwt.sub, "unknown")'
            unit: Tokens
          - entries:
              - name: group_total
                expression: '"rpcu-admin" in default(jwt.groups, []) ? "rpcu-admin" : ("public-admin" in default(jwt.groups, []) ? "public-admin" : "public-user")'
            unit: Tokens
