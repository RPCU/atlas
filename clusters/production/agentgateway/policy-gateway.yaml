# Who may call the gateway, and how much they may spend.
#
# CRD v2.2.1 limits: only authorization, rateLimit, and transformation are
# available as CRD policy fields. OIDC and JWT auth are configured via
# rawConfig in gateway.yaml (see that file for the full auth stack).
#
# Evaluation order: rawConfig policies (OIDC, JWT) run first (gateway-level),
# then these CRD policies (authorization, rateLimit).
#
# IMPORTANT: rawConfig.policies and CRD policies are all merged into the
# config's `policies` array. If two policies target the same Gateway with
# the same phase, the last one in the array wins. The rawConfig policies
# use names `llm-oidc` and `llm-jwt`, while this CRD policy is `llm` —
# different names, so they coexist. The rawConfig policies are injected
# AFTER CRD policies in the merge, so they run later in evaluation order.
#
# Everything that targets this Gateway in the default (PostRouting) phase
# lives in ONE CRD policy on purpose. When two AgentgatewayPolicy resources
# target the same Gateway, one silently overwrites the other based on
# creation order — both still report ACCEPTED/ATTACHED, so the failure is
# invisible. The only other policies that touch this Gateway are
# policy-claude-code.yaml and policy-prompt.yaml (both target the HTTPRoute,
# not the Gateway).
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: llm
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm
  traffic:
    # ---- Authorization --------------------------------------------------
    # A signature-valid JWT is not enough: the caller must actually hold one
    # of the org's roles. Every registered user is auto-granted `public-user` by
    # the argus `addUserGrant` Action, so in practice this admits every real
    # user while rejecting tokens minted for unrelated apps with no grants.
    # Tighten by removing entries from the list.
    authorization:
      action: Allow
      policy:
        matchExpressions:
          - '["rpcu-admin", "public-admin", "public-user"].exists(g, g in default(jwt.groups, []))'

    # ---- Token budgets --------------------------------------------------
    # unit: Tokens means the cost debited per request is the LLM token count
    # (input + output), not 1. So `requests_per_unit` in the rate limit server
    # config (ratelimit.yaml) is literally a daily token budget.
    #
    # Two independent descriptors, hence two independent counters:
    #   1. [group, user_id] — each user's own budget, sized by their group.
    #   2. [group_total]    — a ceiling for the whole group combined.
    # The key names differ (group vs group_total) so the two descriptor trees
    # in the rate limit server config cannot collide.
    #
    # The group expression collapses the claim array to a single tier, highest
    # privilege wins. default() guards the case where the claim is absent.
    rateLimit:
      global:
        domain: agentgateway
        backendRef:
          kind: Service
          name: ratelimit
          namespace: agentgateway-system
          port: 8081
        descriptors:
          - entries:
              - name: group
                expression: '"rpcu-admin" in default(jwt.groups, []) ? "rpcu-admin" : ("public-admin" in default(jwt.groups, []) ? "public-admin" : "public-user")'
              - name: user_id
                expression: 'default(jwt.sub, "unknown")'
            unit: Tokens
          - entries:
              - name: group_total
                expression: '"rpcu-admin" in default(jwt.groups, []) ? "rpcu-admin" : ("public-admin" in default(jwt.groups, []) ? "public-admin" : "public-user")'
            unit: Tokens
