# Who may call the gateway, and how much they may spend.
#
# Everything that targets this Gateway in the default (PostRouting) phase lives
# in ONE policy on purpose. When two AgentgatewayPolicy resources target the
# same Gateway, one silently overwrites the other based on creation order —
# both still report ACCEPTED/ATTACHED, so the failure is invisible. The only
# other policies that touch this Gateway are policy-claude-code.yaml and
# policy-prompt.yaml (both target the HTTPRoute, not the Gateway).
#
# IDENTITY: Zitadel JWTs via agentgateway's built-in OIDC browser auth. The
# `groups` claim is produced by the argus-owned `groupsClaim` Zitadel Action,
# which flattens every project role the user is granted into a flat array,
# e.g. ["public-user"] or ["rpcu-admin"]. It only appears if the issuing app
# has role assertion enabled AND issues real JWTs rather than opaque bearer
# tokens — see crossplane/oidc-agentgateway.yaml.
#
# Evaluation order matters for cost: OIDC login + authentication runs BEFORE
# rate limiting, so an unauthenticated request never consumes anyone's budget.
# Rate limiting runs BEFORE prompt guards, so a request rejected by a future
# guardrail still debits the budget.
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: llm
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: llm
  traffic:
    # ---- OIDC browser authentication ------------------------------------
    # Built-in OIDC login for the chat UI (port 15000). Unauthenticated
    # browser requests are redirected to Zitadel. After login, an encrypted
    # session cookie carries the JWT. API clients can also send a Bearer
    # token directly — both paths end at the same jwtAuthentication below.
    oidc:
      issuer: https://rpcu-gabeck.eu1.zitadel.cloud
      clientId:
        secretKeyRef:
          name: agentgateway-oidc
          key: attribute.client_id
      clientSecret:
        secretKeyRef:
          name: agentgateway-oidc
          key: attribute.client_secret
      redirectURI: https://chat.rpcu.io/oauth/callback
      scopes:
        - openid
        - profile
        - email

    # ---- Authentication -------------------------------------------------
    # Strict: no valid Zitadel JWT, no request. This endpoint is on the public
    # internet and spends real money, so there is no anonymous mode.
    # `audiences` is left unset because the Zitadel client ID is generated by
    # Crossplane and is not knowable at authoring time; the issuer + signature
    # check is what actually gates access, and the authorization rule below
    # additionally requires a role grant in this org.
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: https://rpcu-gabeck.eu1.zitadel.cloud
          jwks:
            remote:
              url: https://rpcu-gabeck.eu1.zitadel.cloud/oauth/v2/keys
              cacheDuration: 1h

    # ---- Authorization --------------------------------------------------
    # A signature-valid token is not enough: the caller must actually hold one
    # of the org's roles. Every registered user is auto-granted `public-user` by
    # the argus `addUserGrant` Action, so in practice this admits every real
    # user while rejecting tokens minted for unrelated apps with no grants.
    # Tighten by removing entries from the list.
    authorization:
      action: Allow
      policy:
        matchExpressions:
          - '["rpcu-admin", "public-admin", "public-user"].exists(g, g in default(jwt.groups, []))'

    # ---- Token budgets --------------------------------------------------
    # unit: Tokens means the cost debited per request is the LLM token count
    # (input + output), not 1. So `requests_per_unit` in the rate limit server
    # config (ratelimit.yaml) is literally a daily token budget.
    #
    # Two independent descriptors, hence two independent counters:
    #   1. [group, user_id] — each user's own budget, sized by their group.
    #      Alice and Bob in public-user each get their own 100k/day.
    #   2. [group_total]    — a ceiling for the whole group combined, so one
    #      group cannot drain the account even if every member behaves.
    # The key names differ (group vs group_total) so the two descriptor trees
    # in the rate limit server config cannot collide.
    #
    # The group expression collapses the claim array to a single tier, highest
    # privilege wins. It is written as a plain ternary rather than using with()
    # deliberately: if a descriptor expression fails at request time,
    # agentgateway SKIPS that descriptor entirely and enforces no limit for it.
    # A cost control that fails open must use only the most boring CEL possible.
    # default() guards the case where the claim is absent.
    rateLimit:
      global:
        domain: agentgateway
        backendRef:
          kind: Service
          name: ratelimit
          namespace: agentgateway-system
          port: 8081
        descriptors:
          - entries:
              - name: group
                expression: '"rpcu-admin" in default(jwt.groups, []) ? "rpcu-admin" : ("public-admin" in default(jwt.groups, []) ? "public-admin" : "public-user")'
              - name: user_id
                expression: 'default(jwt.sub, "unknown")'
            unit: Tokens
          - entries:
              - name: group_total
                expression: '"rpcu-admin" in default(jwt.groups, []) ? "rpcu-admin" : ("public-admin" in default(jwt.groups, []) ? "public-admin" : "public-user")'
            unit: Tokens

  # ---- Metrics ----------------------------------------------------------
  # Adds identity labels to every Prometheus metric the proxy emits, which is
  # what makes agentgateway_gen_ai_client_token_usage_sum queryable per user
  # and per group (and therefore chargeable). frontend.metrics can only be set
  # by a policy that targets a Gateway, which is another reason this all lives
  # in one resource.
  #
  # llm_user is a high-cardinality label: one series per distinct subject. That
  # is fine at this scale (a handful of humans) but do not let it grow — these
  # metrics are remote_written to the shared Mimir on mgmt.
  frontend:
    metrics:
      attributes:
        add:
          - name: llm_group
            expression: '"rpcu-admin" in default(jwt.groups, []) ? "rpcu-admin" : ("public-admin" in default(jwt.groups, []) ? "public-admin" : "public-user")'
          - name: llm_user
            expression: 'default(jwt.sub, "unknown")'
