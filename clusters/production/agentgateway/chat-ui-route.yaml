# Internal route: forwards chat.rpcu.io traffic arriving on the llm Gateway
# (port 80, ClusterIP) to the built-in chat UI on the admin interface
# (127.0.0.1:15000). The llm proxy is in the same container, so it CAN reach
# localhost:15000 — traffic from an external Service cannot (it arrives on the
# pod IP, not the loopback).
#
# External flow:
#   chat.rpcu.io → https-external Gateway → chat-httproute → chat-oauth2-proxy:80
#   → (Zitadel OIDC, session cookie, pass_access_token) → llm:80
#   → this route → llm:15000 → admin serves chat UI
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chat-ui-route
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: llm
      namespace: agentgateway-system
  hostnames:
    - "chat.rpcu.io"
  rules:
    - backendRefs:
        - name: llm
          port: 15000
      timeouts:
        request: 1800s
