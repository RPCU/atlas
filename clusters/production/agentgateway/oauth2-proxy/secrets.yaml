# Cookie-encryption secret for oauth2-proxy, reusing the shared cookie secret in
# Vault (same one the radarr/prowlarr/etc. oauth2-proxies use).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chat-oauth2-proxy-secrets
  namespace: agentgateway-system
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: chat-oauth2-proxy-secrets
  data:
    - secretKey: cookie-secret
      remoteRef:
        key: secrets-production/oauth2-proxy/config
        property: cookie-secret
