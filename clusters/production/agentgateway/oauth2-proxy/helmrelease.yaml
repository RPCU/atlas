# oauth2-proxy is the Zitadel OIDC browser front door for chat.rpcu.io.
#
# Why it exists: agentgateway's native OIDC browser login is standalone-only —
# it does NOT exist in the Kubernetes controller path (no traffic.oidc CRD field,
# no oidc rawConfig policy on the deployed proxy). So the OIDC redirect/login/
# cookie flow is delegated here, exactly like the radarr/prowlarr internal apps.
#
# pass_access_token = true forwards the Zitadel access token upstream as
# `Authorization: Bearer <token>`, which the llm Gateway's AgentgatewayPolicy
# (policy-gateway.yaml) then verifies (jwtAuthentication) and uses for group
# authorization + per-group token-budget rate limiting.
#
# Upstream is the built-in chat UI on llm:15000. Public exposure + TLS + DNS are
# handled by the https-external kgateway Gateway (chat-httproute.yaml).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chat-oauth2-proxy
  namespace: agentgateway-system
spec:
  interval: 1h
  chart:
    spec:
      chart: oauth2-proxy
      version: 10.7.0
      sourceRef:
        kind: HelmRepository
        name: agentgateway-oauth2-proxy
  # Wait for the Crossplane-written OIDC connection secret + the cookie secret.
  dependsOn:
    - name: crossplane-resources
      namespace: flux-system
  values:
    config:
      configFile: |-
        email_domains = [ "*" ]
        provider = "oidc"
        user_id_claim = "sub"
        provider_display_name = "ZITADEL"
        pass_access_token = true
        pass_authorization_header = true
        set_authorization_header = true
        skip_provider_button = true
        cookie_secure = true
        upstreams = [
          "http://llm.agentgateway-system.svc.cluster.local:15000"
        ]
        redirect_url = "https://chat.rpcu.io/oauth2/callback"
        oidc_issuer_url = "https://rpcu-gabeck.eu1.zitadel.cloud"
        scope = "openid profile email"
    extraEnv:
      - name: OAUTH2_PROXY_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: agentgateway-oidc
            key: attribute.client_id
      - name: OAUTH2_PROXY_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: agentgateway-oidc
            key: attribute.client_secret
      - name: OAUTH2_PROXY_COOKIE_SECRET
        valueFrom:
          secretKeyRef:
            name: chat-oauth2-proxy-secrets
            key: cookie-secret
    resources:
      limits:
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 32Mi
    proxyVarsAsSecrets: false
    replicaCount: 1
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    httpScheme: http
