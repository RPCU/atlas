apiVersion: apps/v1
kind: Deployment
metadata:
  name: palworld
  labels:
    app: palworld
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: palworld
  template:
    metadata:
      labels:
        app: palworld
    spec:
      terminationGracePeriodSeconds: 330
      securityContext:
        fsGroup: 1000
      containers:
        - name: palworld
          image: thijsvanloef/palworld-server-docker:v2.7.1
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - >-
                    rest-cli announce '{"message": "Server is restarting in 5 minutes. Please find a safe spot."}' &&
                    sleep 300 &&
                    rest-cli save &&
                    rest-cli shutdown '{"waittime": 10, "message": "Server is restarting now."}'
          resources:
            requests:
              memory: 4Gi
              cpu: 2
            limits:
              memory: 12Gi
              cpu: 4
          ports:
            - name: game
              containerPort: 8211
              protocol: UDP
            - name: query
              containerPort: 27015
              protocol: UDP
            - name: rest-api
              containerPort: 8212
              protocol: TCP
            - name: rcon
              containerPort: 25575
              protocol: TCP
          envFrom:
            - configMapRef:
                name: palworld-config
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: palworld-secrets
                  key: ADMIN_PASSWORD
            - name: SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: palworld-secrets
                  key: SERVER_PASSWORD
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: palworld-secrets
                  key: DISCORD_WEBHOOK_URL
          volumeMounts:
            - name: data
              mountPath: /palworld
        - name: playit
          image: ghcr.io/playit-cloud/playit-agent:1.0.10
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: palworld-secrets
                  key: PLAYIT_SECRET_KEY
        - name: exporter
          image: docker.io/banhcanh/palworld-exporter:v0.0.3
          ports:
            - name: metrics
              containerPort: 18212
              protocol: TCP
          env:
            # Scrapes the REST API (enabled by default in the server image,
            # REST_API_PORT=8212 in palworld-config), not RCON.
            - name: SCRAPE_URI
              value: "http://127.0.0.1:8212/v1/api"
            - name: HTTP_USER
              value: "admin"
            - name: HTTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: palworld-secrets
                  key: ADMIN_PASSWORD
            - name: SAVE_DIRECTORY
              value: "/palworld"
            - name: LISTEN_ADDRESS
              value: ":18212"
          resources:
            requests:
              memory: 64Mi
              cpu: 10m
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /palworld
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: palworld-data
