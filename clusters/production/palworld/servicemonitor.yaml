apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: palworld
  labels:
    app: palworld
    # Required: kube-prometheus-stack's Prometheus only selects ServiceMonitors
    # carrying the Helm release label (serviceMonitorSelectorNilUsesHelmValues: true).
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: palworld
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
