# Populate out of band: secrets-production/ntfy/config
#   AUTH_USERS:  "khoa:<bcrypt>:user,chocomooncake:<bcrypt>:user"
#                (hash with `ntfy user hash` or `htpasswd -bnBC 10 "" PASS`)
#   AUTH_TOKENS: "khoa:tk_<29 [a-z0-9]>:totoro,chocomooncake:tk_<29 [a-z0-9]>:hanamichi"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-secrets
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ntfy-secrets
  data:
    - secretKey: AUTH_USERS
      remoteRef:
        key: secrets-production/ntfy/config
        property: AUTH_USERS
    - secretKey: AUTH_TOKENS
      remoteRef:
        key: secrets-production/ntfy/config
        property: AUTH_TOKENS
