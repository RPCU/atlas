# ntfy server config. Users and their access tokens come from Vault
# (NTFY_AUTH_USERS / NTFY_AUTH_TOKENS, see secrets.yaml); everything else,
# including who may use which topic, lives here. Users, ACL entries and
# tokens are "provisioned" at every start: removing one here (or in Vault)
# deletes it from the user database.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
data:
  server.yml: |
    base-url: "https://ntfy.rpcu.io"
    listen-http: ":8080"
    behind-proxy: true

    # Messages wait 3 months (90 days) for a desktop that is offline: the
    # mesh's history catches up after holidays. Tiny encrypted payloads:
    # ~16 MB for three people's status updates over 90 days. Attachments
    # still expire after 72h (below).
    cache-file: "/var/lib/ntfy/cache.db"
    cache-duration: "2160h"

    # The mesh's files (images, GIFs, documents), encrypted on the desktops:
    # each desktop downloads a file as soon as its message arrives, so 72h
    # only matters to one that was off longer. Up to 100M a file (under the
    # Gateway's 128Mi per-connection buffer), 1500M in all on the 2Gi
    # volume. ntfy's per-sender defaults (100M stored, 500M a day of
    # transfer, uploads and downloads) would cap a 100M file's sharing at a
    # few people: raised too. The desktops read the limits from /v1/account.
    attachment-cache-dir: "/var/lib/ntfy/attachments"
    attachment-total-size-limit: "1500M"
    attachment-file-size-limit: "100M"
    attachment-expiry-duration: "72h"
    visitor-attachment-total-size-limit: "1G"
    visitor-attachment-daily-bandwidth-limit: "5G"

    # Closed by default: only provisioned users, only their topics.
    auth-file: "/var/lib/ntfy/user.db"
    auth-default-access: "deny-all"
    enable-signup: false
    enable-login: true
    # Nobody gets topics from here: the admin (Vault: AUTH_USERS
    # "khoa:<hash>:admin" + its token) reaches every topic, and invites the
    # mesh's members from their desktop (nixbook-shell, Settings > General >
    # Mesh): ntfy's admin API creates each account with mesh-* access, kept
    # in user.db on the volume. Admins can't have ACL lines: one here for the
    # admin stops ntfy from starting.
    auth-access: []

    enable-metrics: true
    metrics-listen-http: ":9090"
    log-level: "info"
