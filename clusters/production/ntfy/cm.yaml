# ntfy server config. Users and their access tokens come from Vault
# (NTFY_AUTH_USERS / NTFY_AUTH_TOKENS, see secrets.yaml); everything else,
# including who may use which topic, lives here. Users, ACL entries and
# tokens are "provisioned" at every start: removing one here (or in Vault)
# deletes it from the user database.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
data:
  server.yml: |
    base-url: "https://ntfy.rpcu.io"
    listen-http: ":8080"
    behind-proxy: true

    # Messages and the mesh's files (images, GIFs, documents, encrypted on
    # the desktops) wait a year for a desktop that is offline: the mesh's
    # history catches up after anything, and a file stays there to fetch.
    # Tiny encrypted payloads for messages (~16 MB for three people's
    # status updates over 90 days); files up to 10G each, 50G in all on the
    # 60Gi volume (pvc.yaml). ntfy's per-sender defaults (100M stored, 500M
    # a day of uploads and downloads) raised to the whole store and 200G a
    # day. The desktops read these limits from /v1/account; uploads that
    # long need the HTTPRoute's 6h timeout.
    cache-file: "/var/lib/ntfy/cache.db"
    cache-duration: "8760h"
    attachment-cache-dir: "/var/lib/ntfy/attachments"
    attachment-total-size-limit: "50G"
    attachment-file-size-limit: "10G"
    attachment-expiry-duration: "8760h"
    visitor-attachment-total-size-limit: "50G"
    visitor-attachment-daily-bandwidth-limit: "200G"

    # Closed by default: only provisioned users, only their topics.
    auth-file: "/var/lib/ntfy/user.db"
    auth-default-access: "deny-all"
    enable-signup: false
    enable-login: true
    # Nobody gets topics from here: the admin (Vault: AUTH_USERS
    # "khoa:<hash>:admin" + its token) reaches every topic, and invites the
    # mesh's members from their desktop (nixbook-shell, Settings > General >
    # Mesh): ntfy's admin API creates each account with mesh-* access, kept
    # in user.db on the volume. Admins can't have ACL lines: one here for the
    # admin stops ntfy from starting.
    auth-access: []

    enable-metrics: true
    metrics-listen-http: ":9090"
    log-level: "info"
