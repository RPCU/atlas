apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ntfy
spec:
  parentRefs:
    - name: https-external
      namespace: kgateway-system
  hostnames:
    - "ntfy.rpcu.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Subscribers hold a JSON stream / WebSocket open; ntfy keeps it alive
      # every 45s and clients reconnect (with `since`) when it is cut.
      timeouts:
        request: "21600s"
        backendRequest: "21600s"
      backendRefs:
        - name: ntfy
          port: 80
