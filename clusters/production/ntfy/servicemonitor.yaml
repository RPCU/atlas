apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ntfy
  labels:
    app: ntfy
    # Required: kube-prometheus-stack's Prometheus only selects ServiceMonitors
    # carrying the Helm release label (serviceMonitorSelectorNilUsesHelmValues: true).
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: ntfy
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
