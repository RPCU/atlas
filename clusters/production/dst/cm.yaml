apiVersion: v1
kind: ConfigMap
metadata:
  name: dst-config
data:
  # __CLUSTER_PASSWORD__ / __CLUSTER_KEY__ are filled from dst-secrets by the
  # `render-config` init container, which rewrites these files on every start
  # (the world save under Master/save is never touched).
  cluster.ini: |
    [GAMEPLAY]
    game_mode = survival
    max_players = 6
    pvp = false
    pause_when_empty = true

    [NETWORK]
    cluster_name = RPCU DST
    cluster_description = RPCU Don't Starve Together
    cluster_password = __CLUSTER_PASSWORD__
    cluster_intention = cooperative
    cluster_language = en
    lan_only_cluster = false
    offline_cluster = false
    tick_rate = 15

    [MISC]
    console_enabled = true
    max_snapshots = 6

    [SHARD]
    # Single shard (overworld only); Caves removed 2026-11-09.
    shard_enabled = false
  master-server.ini: |
    [NETWORK]
    server_port = 10999

    [SHARD]
    is_master = true
    name = Master

    [STEAM]
    master_server_port = 27018
    authentication_port = 8768

    [ACCOUNT]
    encode_user_path = true
