apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dst-secrets
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: dst-secrets
  data:
    # Klei server token (accounts.klei.com → Games → DST → Game Servers).
    - secretKey: CLUSTER_TOKEN
      remoteRef:
        key: secrets-production/dst/config
        property: CLUSTER_TOKEN
    # Join password players type in. Keep it [A-Za-z0-9] (it is sed-substituted).
    - secretKey: CLUSTER_PASSWORD
      remoteRef:
        key: secrets-production/dst/config
        property: CLUSTER_PASSWORD
    # Shared secret for the Master <-> Caves shard link. Any random [A-Za-z0-9].
    - secretKey: CLUSTER_KEY
      remoteRef:
        key: secrets-production/dst/config
        property: CLUSTER_KEY
    # Dedicated playit.gg agent for DST (not the palworld one).
    - secretKey: PLAYIT_SECRET_KEY
      remoteRef:
        key: secrets-production/dst/config
        property: PLAYIT_SECRET_KEY
