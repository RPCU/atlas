apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: jellystat-postgres
spec:
  instances: 1
  enablePDB: false
  # jellystat expects the DB name "jfstat" (POSTGRES_DB default) with the
  # bootstrap user as owner. Creds come from the ESO-managed jellystat-db secret.
  bootstrap:
    initdb:
      database: jfstat
      owner: jellystat
      secret:
        name: jellystat-db
  storage:
    size: 10Gi
    # RWO Cinder default StorageClass (argus-provided)
  # No resources were set before this; each instance was fully unbounded on
  # memory-constrained nodes. Observed usage per instance over an 8h sample:
  # ~59-124Mi RSS, ~6-13m CPU.
  resources:
    requests:
      memory: 256Mi
      # 72h peak ~10m CPU per instance (Mimir). 100m was ~10x peak;
      # 50m keeps headroom for a small metadata DB.
      cpu: 50m
    limits:
      memory: 512Mi
