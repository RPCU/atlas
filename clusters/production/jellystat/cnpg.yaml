apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: jellystat-postgres
spec:
  instances: 1
  enablePDB: false
  # jellystat expects the DB name "jfstat" (POSTGRES_DB default) with the
  # bootstrap user as owner. Creds come from the ESO-managed jellystat-db secret.
  bootstrap:
    initdb:
      database: jfstat
      owner: jellystat
      secret:
        name: jellystat-db
  storage:
    size: 10Gi
    # RWO Cinder default StorageClass (argus-provided)
  # 72h Mimir (2026-09-28): mem p95 131Mi / max 135Mi, CPU p95 13m / max 15m.
  # Limit keeps ~3x max for the default shared_buffers (128MB) + vacuum.
  resources:
    requests:
      memory: 144Mi
      cpu: 15m
    limits:
      memory: 384Mi
