---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.1
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: cnpg-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    crds:
      create: true
    resources:
      requests:
        # Low-churn operator. 72h Mimir (2026-09-28): mem p95 76Mi / max
        # 95Mi, CPU p95 5m. CPU request-only (no CPU limit).
        cpu: 5m
        memory: 80Mi
      limits:
        memory: 256Mi
