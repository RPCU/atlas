apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: https-external
  namespace: kgateway-system
  annotations:
    external-dns.alpha.kubernetes.io/target: rpcu.io
    cert-manager.io/cluster-issuer: rpcuio
    kgateway.dev/per-connection-buffer-limit: "128Mi"
spec:
  gatewayClassName: kgateway
  addresses:
    - type: IPAddress
      value: 172.16.255.10
  allowedListeners:
    namespaces:
      from: All
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: gwp-static-ip
  listeners:
    - protocol: HTTP
      port: 80
      name: http
      hostname: "*.rpcu.io"
      allowedRoutes:
        namespaces:
          from: All
    - protocol: HTTPS
      port: 443
      name: https
      hostname: "*.rpcu.io"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: rpcu-io-wildcard-tls
    # Kamaji tenant control plane API servers — TLS Passthrough for SNI routing.
    # Same pattern as the internal kcp listener on the "https" gateway, but on
    # the public *.kcp.rpcu.io domain. Each tenant cluster gets its own TLSRoute
    # (created by the Kamaji controller) with hostname <tenant>.kcp.rpcu.io.
    # Port 6443 (not 443) because Kamaji always advertises networkProfile.port
    # (6443) in kubeconfigs and has no advertised-port override.
    - protocol: TLS
      port: 6443
      name: kcp
      hostname: "*.kcp.rpcu.io"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Passthrough
    # Kamaji konnectivity server — port 8132 is HARDCODED by Kamaji. Every
    # gateway in the TCP's parentRefs must carry this listener or the worker-node
    # agents can't establish the tunnel (breaks logs/exec/port-forward/metrics).
    - protocol: TLS
      port: 8132
      name: konnectivity-server
      hostname: "*.kcp.rpcu.io"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Passthrough
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect-external
  namespace: kgateway-system
spec:
  parentRefs:
    - name: https-external
      sectionName: http
      namespace: kgateway-system
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
