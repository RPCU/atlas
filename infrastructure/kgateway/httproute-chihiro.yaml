apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: chihiro-mgmt
  namespace: kgateway-system
spec:
  type: Static
  static:
    hosts:
      - host: 172.16.255.11
        port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chihiro
  namespace: kgateway-system
spec:
  parentRefs:
    - name: https-external
      namespace: kgateway-system
      sectionName: https
  hostnames:
    - "chihiro.rpcu.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ws
      backendRefs:
        - name: chihiro-mgmt
          kind: Backend
          group: gateway.kgateway.dev
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: chihiro-mgmt
          kind: Backend
          group: gateway.kgateway.dev
