apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: chihiro-mgmt
  namespace: kgateway-system
spec:
  type: Static
  static:
    hosts:
      - host: chihiro.mgmt.rpcu.lan
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chihiro
  namespace: kgateway-system
spec:
  parentRefs:
    - name: https-external
      namespace: kgateway-system
      sectionName: https
  hostnames:
    - "chihiro.rpcu.io"
  rules:
    - backendRefs:
        - name: chihiro-mgmt
          kind: Backend
          group: gateway.kgateway.dev
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: chihiro.mgmt.rpcu.lan
---
apiVersion: gateway.networking.k8s.io/v1alpha1
kind: BackendTLSPolicy
metadata:
  name: backendtls-chihiro
  namespace: kgateway-system
spec:
  targetRefs:
    - group: gateway.kgateway.dev
      kind: Backend
      name: chihiro-mgmt
  validation:
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: root-mgmt-bundle
    hostname: chihiro.mgmt.rpcu.lan
